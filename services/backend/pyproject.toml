[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adt-backend"
version = "0.0.0"
description = "ADT — Automatic Dry Trade Backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ADT Team" }
]

dependencies = [
  "fastapi>=0.104.1",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.25.2",
  "psycopg[binary,pool]>=3.1.18,<4.0.0",
  "PyJWT[crypto]>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.3",
  "pytest-asyncio>=0.21.1",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.8",
  "mypy>=1.7.1",
  "black>=23.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
