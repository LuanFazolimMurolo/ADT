services:
  api:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.production
    image: adt-backend:${ADT_IMAGE_TAG:-local}
    command: ["python", "-m", "app.main"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    environment:
      ADT_ENVIRONMENT: production
      ADT_LOG_LEVEL: ${ADT_LOG_LEVEL:-INFO}
      ADT_CORS_ORIGINS: ${ADT_CORS_ORIGINS:?ADT_CORS_ORIGINS is required}
      ADT_API_HOST: 0.0.0.0
      ADT_API_PORT: "8000"
      ADT_DATA_DIR: /srv/adt/data
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:?SUPABASE_DATABASE_URL is required}
    volumes:
      - type: bind
        source: /srv/adt/data
        target: /srv/adt/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:8000/health/readiness', timeout=5); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - adt-internal

  market-supervisor:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.production
    image: adt-backend:${ADT_IMAGE_TAG:-local}
    command: ["python", "-m", "app.runtime.market_data_supervisor"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    environment:
      ADT_ENVIRONMENT: production
      ADT_LOG_LEVEL: ${ADT_LOG_LEVEL:-INFO}
      ADT_DATA_DIR: /srv/adt/data
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:?SUPABASE_DATABASE_URL is required}
    volumes:
      - type: bind
        source: /srv/adt/data
        target: /srv/adt/data
    networks:
      - adt-internal

  paper-supervisor:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.production
    image: adt-backend:${ADT_IMAGE_TAG:-local}
    command: ["python", "-m", "app.runtime.paper_run_supervisor"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    environment:
      ADT_ENVIRONMENT: production
      ADT_LOG_LEVEL: ${ADT_LOG_LEVEL:-INFO}
      ADT_DATA_DIR: /srv/adt/data
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:?SUPABASE_DATABASE_URL is required}
    volumes:
      - type: bind
        source: /srv/adt/data
        target: /srv/adt/data
    networks:
      - adt-internal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.production
      args:
        VITE_ADT_API_URL: ${VITE_ADT_API_URL:?VITE_ADT_API_URL is required}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?VITE_SUPABASE_PUBLISHABLE_KEY is required}
    image: adt-web:${ADT_IMAGE_TAG:-local}
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - adt-internal

networks:
  adt-internal:
    driver: bridge
